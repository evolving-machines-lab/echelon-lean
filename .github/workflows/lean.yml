name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Check axioms
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          test "$(grep -c 'depends on axioms' axioms.txt)" -eq 35
          if grep 'depends on axioms' axioms.txt | grep -v 'depends on axioms: \[propext, Classical.choice, Quot.sound\]'; then
            echo "unexpected axioms"; exit 1
          fi
